  "Johan Casimiro": {
    "title": "Cosmological Dynamics and Observational Constraints in f(Q, Φ) Gravity: From Critical Points to MCMC Contours",
    "abstract": "The search for viable alternatives to  Lambda-CDM requires not only new gravitational models, but also systematic criteria to identify which regions of their parameter space are physically meaningful and observationally testable. In this talk, I present a cosmological model based on non-metricity gravity f(Q, Φ), coupled to a non-canonical dilatonic scalar field, and discuss how dynamical systems can be used as a theoretical guide for Bayesian parameter inference.\n\nStarting from the effective action, the modified Friedmann equations are derived and rewritten as an autonomous system in terms of suitable dimensionless variables. The critical-point structure is then analyzed in order to identify radiation-dominated, matter-dominated, scaling, and late-time accelerated solutions. The existence conditions, stability properties, eigenvalues, and effective cosmological parameters associated with these critical points provide a first viability filter for the model. In particular, they indicate which parameters directly control the cosmological dynamics and are therefore expected to be constrained by observational data.\n\nA central point of the methodology is the construction of physically motivated priors for Markov Chain Monte Carlo analyses. Instead of choosing arbitrary numerical intervals, the prior ranges are selected through three complementary criteria. First, one identifies the model parameters that explicitly appear in the coordinates, existence conditions, eigenvalues, or effective observables of the relevant dark-energy critical points. Parameters that do not enter this dynamical structure are expected to generate weakly informative or degenerate marginal distributions and may be fixed or treated as secondary parameters, since they are not efficiently constrained by background observables. Second, the prior intervals are refined by numerically evolving the autonomous system and requiring convergence toward the desired cosmological attractor, as seen in the evolution of the dimensionless variables. Third, the resulting viable regions are tested at the background level by comparing the predicted Hubble function (H(z)) with the Lambda-CDM curve, requiring the prior extremes to explore controlled deviations around the standard cosmological expansion.\n\nOnce these dynamically informed priors are established, the model is confronted with observational expansion data, including Cosmic Chronometers, Type Ia supernovae, and BAO/DESI measurements. The resulting MCMC contours are then interpreted not only as statistical constraints, but also as observational projections of the underlying phase-space structure. In this sense, correlations and degeneracies in the corner plots can be related to the existence and stability of the critical points that govern the cosmic evolution.\n\nThis work aims to provide a transparent connection between modified gravity, dynamical stability, prior selection, and observational inference. The proposed framework shows how critical points can be used not only to classify the qualitative evolution of a cosmological model, but also to guide the construction of priors and to interpret which parameters are genuinely constrained by cosmological data."
  },
  "Andressa Mouta Ribeiro": {
    "title": "A Exhaustive Symbolic Regression Framework for Reconstructing Dark Energy Evolution from Cosmological Observables",
    "abstract": "The nature of dark energy remains one of the central open questions in modern cosmology. Most reconstruction approaches rely on predefined parametric forms for the dark energy equation of state or energy density evolution, potentially biasing the inferred dynamics. In this work, we explore a data-driven alternative based on Exhaustive Symbolic Regression (ESR), which generates analytical functional forms directly from a predefined mathematical basis without assuming a specific cosmological parametrization.\nWe interpret the ESR-generated functions as candidate models for the normalized dark energy density evolution, and subject them to a sequence of physical consistency requirements, including positivity and early-time subdominance relative to matter. Surviving models are propagated through the Friedmann equation to obtain cosmological observables such as the Hubble expansion rate, the comoving distance, and the luminosity distance.\nThe resulting predictions are compared with Cosmic Chronometer, Type Ia Supernova, and Baryon Acoustic Oscillation measurements. Model ranking is performed using the Minimum Description Length (MDL) principle, which balances goodness-of-fit against functional complexity. This framework enables a systematic exploration of physically viable dark energy evolutions and provides a route toward identifying simple analytical descriptions favored by cosmological observations."
  },
  "Marcelo Rubio": {
    "title": "Well-posedness and gravitational collapse of self-interacting vector fields",
    "abstract": "I will discuss the Cauchy problem for self-interacting massive vector fields, which often exhibit instabilities and apparent pathologies in numerical simulations. After showing that these issues arise from a breakdown in the well-posedness of the initial value problem, I will explain how such pathologies can be classified, building on previous work on a class of scalar–tensor theories of gravity. I will then describe how these issues can be avoided by “fixing the equations,” thereby enabling stable numerical evolutions in spherical symmetry.\nFinally, I will present initial configurations of the massive vector field that lead to gravitational collapse and the formation of black holes in theories with cubic self-interactions."
  },
  "Francisco Tello Ortiz": {
    "title": "Mass inflation or scalaron rigidity: Cauchy horizons in metric f(R) gravity",
    "abstract": "Cauchy horizons are generically vulnerable to the mass-inflation instability, where the exponential blueshift of decaying perturbations can drive an unbounded growth of the interior mass function. We investigate whether the additional scalar degree of freedom of metric \\(f(R)\\) gravity can modify this mechanism. Working in spherical symmetry and a fully double-null formulation, we derive an exact transport equation for the Hawking mass and obtain a local criterion for mass inflation near a regular, nondegenerate Cauchy horizon. In the longitudinally dominated sector, a Price-type influx leads to mass inflation whenever the effective source remains nonintegrable after blueshift weighting. We then analyze the alternative possibility in which scalaron dynamics cancels the leading Price-tail contribution. Rather than providing a generic screening mechanism, this cancellation leads to a strong asymptotic rigidity: in the absence of independent transverse or trace cancellations, the curvature becomes unbounded and the theory is driven toward an asymptotically linear high-curvature regime, \\(f(R)/R\\to F_-\u003e0\\). For regular high-curvature model classes this implies \\(f_{RR}\\to0\\), while an eventually viable branch with \\(f_{RR}\u003e0\\) is forced toward \\(R\\to-\\infty\\) and a divergent scalaron mass parameter. The Einstein-frame description further shows that the cancellation cannot be interpreted as negative scalaron null energy. Our results therefore suggest a sharp dichotomy: at a regular nondegenerate Cauchy horizon, a Price-type influx produces either mass inflation or a highly constrained scalaron-rigidity branch, unless an independent escape mechanism—such as horizon degeneracy, sufficiently rapid exterior decay, or additional dynamical cancellation—intervenes."
  }

let selected=0;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function roomLabel(day,kind){return `Session ${kind.toUpperCase()} · ${day.rooms?.[kind]||'Room to be announced'}`;}
function card(t,kind,day){
  if(!t)return '<div class="empty">No talk scheduled</div>';
  const label=kind==='plenary'?'Plenary':roomLabel(day,kind);
  const location=kind==='plenary'?`<div class="plenary-rooms"><span><b>Session A</b> · Live${day.rooms?.a?' in '+escapeHTML(day.rooms.a):' · Room to be announced'}</span><span><b>Session B</b> · Zoom projection${day.rooms?.b?' in '+escapeHTML(day.rooms.b):' · Room to be announced'}</span></div>`:'';
  return `<details class="talk ${kind}"><summary><div class="tag">${escapeHTML(label)}</div><div class="speaker">${escapeHTML(t.speaker)}</div><div class="title${t.title?'':' pending'}">${escapeHTML(t.title||'Title to be announced')}</div>${location}<div class="expand">${t.abstract?'Abstract':'Abstract to be announced'}</div></summary><div class="abstract"><strong>Abstract</strong><div class="abstract-text">${escapeHTML(t.abstract||'Abstract to be announced.')}</div></div></details>`;
}
function render(){
  const day=program[selected];
  document.getElementById('day-title').textContent=`${day.name}, ${day.date}`;
  document.getElementById('venue').textContent=day.venue;
  document.getElementById('room-a').textContent=roomLabel(day,'a');
  document.getElementById('room-b').textContent=roomLabel(day,'b');
  document.querySelectorAll('.day').forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));
  const q=normalize(document.getElementById('search').value.trim());
  const match=t=>t&&normalize(t.speaker+' '+t.title).includes(q);
  const slots=day.slots.filter(s=>!q||[s.a,s.b,s.plenary].some(match));
  const schedule=document.getElementById('schedule');
  if(window.MathJax?.typesetClear)window.MathJax.typesetClear([schedule]);
  schedule.innerHTML=slots.map(s=>`<section class="slot" aria-label="${s.time}"><div class="time">${s.time}<span>${s.pause?s.kind:s.plenary?'Plenary':'Parallel sessions'}</span></div>${s.pause?`<div class="break">${s.pause}</div>`:s.plenary?card(s.plenary,'plenary',day):card(s.a,'a',day)+card(s.b,'b',day)}</section>`).join('')||'<p class="no-results">No matching talks on this day.</p>';
  typesetMath();
}
let mathQueue=Promise.resolve();
function typesetMath(){
  if(!window.MathJax?.typesetPromise)return;
  mathQueue=mathQueue.then(()=>window.MathJax.typesetPromise([document.getElementById('schedule')])).catch(()=>{});
}
document.getElementById('schedule').addEventListener('toggle',e=>{if(e.target.open)typesetMath();},true);
document.getElementById('days').innerHTML=program.map((d,i)=>`<button type="button" class="day" aria-pressed="${i===0}" data-day="${i}"><small>Day ${i+1} · ${d.name.slice(0,3)}</small><strong>${d.date}</strong></button>`).join('');
document.getElementById('days').addEventListener('click',e=>{const button=e.target.closest('[data-day]');if(!button)return;selected=Number(button.dataset.day);document.getElementById('search').value='';render();});
document.getElementById('search').addEventListener('input',render);
document.getElementById('print').addEventListener('click',()=>window.print());
