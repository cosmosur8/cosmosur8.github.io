<script>
// Speaker submissions imported from the participant list.
const submissions = {
  "Paola Arias": {
    "title": "Axion perturbation growth in low-temperature reheating scenarios",
    "abstract": "We study the evolution of axion overdensities in low-temperature reheating cosmologies, focusing on the interplay between the temperature-dependent axion mass and the radiation background. We show that modes entering the horizon prior to both reheating and the onset of oscillations experience a significant enhancement driven by their coupling to radiation perturbations. This enhancement is maximized when the temperature at which the axion mass becomes constant, $T_\\Lambda$, lies slightly above the reheating temperature, allowing for efficient growth while avoiding the suppression effects near reheating. We characterize the parametric dependence of the overdensity on the axion mass and thermal history, and discuss the implications for the formation of small-scale structure such as axion miniclusters."
  },
  "Daniela Grandón": {
    "title": "Cosmology with weak gravitational lensing",
    "abstract": ""
  },
  "Juan Pablo Elia": {
    "title": "Hydrodynamic models of reheating",
    "abstract": "Reheating after inflation is an intrinsically far-from-equilibrium process whose dynamics are typically studied through microscopic lattice simulations. Developing effective macroscopic descriptions of this stage is important both for understanding the transfer of energy from the inflaton sector to radiation and for connecting early-universe dynamics with potentially observable signatures.\n\nIn this talk, I will present a causal relativistic hydrodynamic description of reheating. The inflaton condensate is modeled as a homogeneous oscillating background interacting with an effective relativistic fluid that encodes the dynamics of inhomogeneous fluctuations. Within this framework, the condensate-fluid interaction naturally generates a parametric resonance in the tensor sector, amplifying viscous stresses and sourcing a stochastic gravitational-wave background. The resulting spectra exhibit characteristic features in qualitative agreement with lattice simulations, suggesting that relativistic hydrodynamics can provide an effective large-scale description of reheating dynamics and their observational consequences."
  },
  "Ximena Paniagua": {
    "title": "Constraints on inflationary parameters through galaxy counts and the weak gravitational lensing effect",
    "abstract": "The observable universe originated from a set of initial conditions established in the early stages of cosmic evolution. The inhomogeneities currently observed in the distribution of temperature and matter originate from primordial curvature fluctuations, whose distribution is typically assumed to be Gaussian. Deviations from this Gaussianity arise from non-linear interactions of the this field, and their detection would represent a fundamental milestone for the physics of the early universe. In this scenario, the cosmology group at the Universidad de Chile has proposed a non-Gaussianity model that introduces two parameters determinable from the cosmic microwave background and the large-scale structure of the universe (CMB and LSS, respectively). To constrain these parameters, it is necessary to define the configuration of a specific survey, such as Euclid or LSST, to then construct its Fisher matrix. This mathematical tool allows for the calculation of the precision with which the experiment will measure the model parameters through the computation of their associated errors. Due to the nature of the model, the Fisher matrix was initially constructed using Galaxy Number Counts as an observable, given that its analytical description formally incorporates the variables of interest. However, the estimated errors turned out to be significantly larger than the fiducial values of each parameter, demonstrating that this observable alone is insufficient.\n\nTherefore, it was proposed to incorporate the weak gravitational lensing effect (weak lensing), a phenomenon closely linked to matter fluctuations and, consequently, to the non-Gaussianity model, with the aim of increasing statistics to reduce errors and study possible orientations in the parameter space."
  },
  "Ariel Angulo": {
    "title": "From Rags to Jeans: Axion Miniclusters from Early Matter Domination",
    "abstract": "La naturaleza de la materia oscura constituye uno de los principales problemas abiertos de la física moderna. Entre sus candidatos más estudiados se encuentra el axión, cuya fenomenología incluye la posible formación de estructuras compactas conocidas como miniclústeres de axiones.\n\nLa formación de estas estructuras depende de la historia de expansión del Universo temprano. Consideramos una era temprana dominada por materia, producida por un campo escalar masivo que domina transitoriamente la densidad de energía y posteriormente recalienta el Universo mediante su decaimiento en radiación. Durante esta época, las perturbaciones de la radiación pueden amplificarse a pequeñas escalas respecto de la historia estándar dominada por radiación.\n\nPara el axión QCD, cuya masa varía rápidamente con la temperatura cerca de la transición de QCD, las perturbaciones de temperatura de la radiación inducen fluctuaciones espaciales en su masa. Esto genera un término fuente adicional en la ecuación de Klein–Gordon perturbada que transfiere perturbaciones de la radiación a la densidad axiónica. Estudiamos este mecanismo resolviendo las ecuaciones acopladas del fondo cosmológico y de las perturbaciones lineales.\n\nEncontramos una amplificación significativa para masas del axión del orden de 10⁻⁷ eV y temperaturas de recalentamiento entre aproximadamente 75 y 130 MeV. En esta región, las perturbaciones alcanzan el régimen no lineal hacia la igualdad materia-radiación, proporcionando semillas para miniclústeres con masas características del orden de 10⁻¹¹ masas solares. El mecanismo permite formar estructuras axiónicas compactas incluso en un escenario preinflacionario de ruptura de Peccei–Quinn, sin recurrir a defectos topológicos ni a grandes perturbaciones isocurvadas primordiales."
  },
  "Pedro Bessa": {
    "title": "Searching for Cosmic Strings with Next Generation Telescopes",
    "abstract": "Cosmic Strings are topological defects generated during phase transitions in the early Universe, generically predicted by Grand Unified Theories at the energy scales at such stage of cosmological evolution. Beyond their effect on cosmological evolution and their imprint on the Cosmic Microwave Background, Cosmic Strings have a characteristic gravitational lensing effect where sources behind such objects in the line of sight of the observer are seen as duplicated, unmagnified objects due to the conical singularity created by such objects. Searches for the gravitational lens signature of these objects have the potential of constraining their cosmic density and offer the possibility of direct observation.\nIn this talk, we discuss the capabilities of next-generation telescopes such as the Vera C. Rubin Observatory, the Nancy Grace Roman Space Telescope, and JWST to search for such objects through their gravitational-lensing signatures. We also explore how machine-learning algorithms can automate this search and identify cosmic-string candidates in wide-field survey data."
  },
  "Thomas Maedler": {
    "title": "",
    "abstract": ""
  },
  "Antonio D. Montero-Dorta": {
    "title": "Individual Bias as a Cosmological Probe Beyond ΛCDM",
    "abstract": "Galaxy bias plays a central role in modern cosmology, connecting the observed large-scale structure of the Universe with the underlying matter density field. While bias is often treated as a nuisance parameter in cosmological analyses, object-by-object and environmental descriptions of bias open new avenues for probing fundamental physics. In this talk, I will present recent developments on the individual halo bias formalism and its application to cosmological models beyond ΛCDM, with emphasis on our analysis of halo bias in Hu–Sawicki f(R) gravity models. I will show how modified gravity affects the environmental dependence and statistical properties of individual halo bias, and how these signatures connect to nonlinear structure formation and assembly bias. I will also discuss the cosmological information encoded in anisotropic and void-related bias statistics—including the Void Galaxy Bias Profile (VGBP)—and their potential as complementary probes of modified gravity and neutrino mass in upcoming surveys such as DESI and LSST."
  },
  "Arindam Bhattacharjee": {
    "title": "Radiation in near extremal black hole backgrounds",
    "abstract": "Near extremal black holes have enhanced near horizon symmetries. These symmetries give rise to a Schwarzian effective description for the system that controls the gravitational dynamics. We study the Hawking radiation from charged black holes near extremality in presence of positive cosmological constant. The interaction between the Schwarzian and the outside geometry hugely alters the evolution of this black holes compared to their flat counterparts and also from the non extremal cases. We then elaborate how similar techniques can be used to study observables like quasi-normal modes of these black hole systems."
  },
  "Cristian Barrera-Hinojosa": {
    "title": "Relativistic effects in the multi-streaming regime: GR N-body simulations of dark-matter collapse",
    "abstract": "Previous numerical-relativity studies of the collapse of cold-dark-matter describe this as a pressureless perfect fluid (dust) and therefore stop at shell crossing, precisely where virialisation begins. In this talk, I will discuss a range of relativistic effects obtained from general-relativistic N-body simulations run with the GRAMSES code, which follow a three-sinusoidal CDM overdensity from the perturbative regime through top-hat turn-around and collapse and well into the multi-streaming regime, in both an isotropic (ISO) and an anisotropic (ANISO) configuration. I will show that relativistic quantities can grow rapidly once shell crossing sets in. The gravitational slip χ ≡ Φ − Ψ rebuilds after collapse to reach |χ|/|Φ| ∼ 2% at the overdensity (halo) centre. The gravitomagnetic vector potential B, responsible for frame dragging, is instead suppressed at the centre and peaks along the filaments, where |B|/|Φ| reaches ∼3% in ISO and ∼5% in ANISO. Finally, I will show that, while the kinematical backreaction remains small at all times, the domain-averaged 3-Ricci curvature parameter reaches ∼3% of Ω_Λ and is still rising at z = 9. These results motivate quantifying such effects in realistic large-scale-structure simulations, and assessing their imprint on cosmological observables at low redshift, as well as the magnitude of gauge effects."
  },
  "Joaquín Andrés Armijo Torres": {
    "title": "Environmental dependent clustering in modified gravity simulations",
    "abstract": "We study environment-dependent clustering using the marked correlation function applied to Hu-Sawicki f(R) modified gravity simulations. This gravity theory enriches the structure formation by enhancing gravity in a scale-dependent form. By employing a multi-scale cosmic structure finder algorithm, we define the cosmic environments divided in: nodes, filaments, walls and voids. We find a stronger impact of modified gravity in nodes and filaments, which together dominate the information content by more than a factor of four relative to other environments. Combining environmental information further enhances the expected signal-to-noise ratio for CMASS- and DESI-like mock samples, particularly in configurations including filaments. Overall, marked correlation functions that incorporate environmental structure increase the information content by about a factor of two compared to standard density-based marks applied to the full galaxy sample. These results demonstrate the importance of environmental information, especially from filaments, in improving the sensitivity of galaxy clustering tests to deviations from GR in the $f(R)$ scenario."
  },
  "Juan Calles": {
    "title": "Primordial non-Gaussianity, fast simulations, and summary statistics",
    "abstract": "We built PNG-pmwd, a public suite of 22,400 halo catalogs from the fast solver pmwd, varying local and equilateral f_NL. With it we benchmarked persistent-homology summaries against the power spectrum and bispectrum in likelihood-free inference. Simple persistence-diagram statistics did best, and nearly all the signal came from massive halos. But models trained on pmwd and tested on QuijotePNG gave biased results for both topology and P+B, unless we kept halos above 200 particles or cut at k_max~0.1 h/Mpc. I would like to discuss how much of the small-scale gain in f_NL sensitivity survives this."
  },
  "Thais Lemos": {
    "title": "Testing the Fundamental Physics with Fast Radio Bursts",
    "abstract": "The search for space-time variations of the fundamental constants has been pursued over the years to test our physical theories. Although most cosmological models assume that these constants are indeed constant, several studies have investigated their possible evolution—for example, variations in the speed of light $c$, the gravitational constant $G$, and the fine-structure constant, among others. Since the $\\Lambda$CDM model presents certain critical issues, additional observational data involving cosmological model-independent approaches to cosmological quantities are required for a proper evaluation of the physical parameters and to avoid assumptions about the large-scale evolution of the Universe. In this context, Fast Radio Bursts (FRBs) have emerged as a recent astrophysical and cosmological phenomenon. FRBs are a class of transient radio events characterized by high brightness temperatures and durations on the order of milliseconds or less. Here, I investigate a possible redshift evolution of the fine-structure constant ($\\alpha$) within the runaway dilaton scenario, as well as updated constraints on the photon rest mass ($m_{\\gamma}$), both by combining well-localized FRBs with the Supernovae dataset."
  },
  "Walter Riquelme": {
    "title": "Unveiling the initial conditions of the Universe: From galaxy surveys to gravitational waves.",
    "abstract": "A pending task for future surveys is to shed light on the initial conditions of the universe. Cosmic inflation predicts statistical properties for the initial seeds that could still live within the large-scale structures (LSS) we see today. Different inflation models predict that the initial fluctuations could have a beyond-Gaussian distribution, a property known as Primordial non-Gaussianity (PNG).\n\nIn this talk, I'll summarise the current status and future perspectives on measuring PNG. I'll first focus on presenting the methodology to measure local PNG​ from Dark Energy Survey (DES) data using the 2-point angular correlation function via the induced scale-dependent bias. I'll briefly mention current efforts to search for an optimised galaxy sample using DES-Y6 data and the prospects for other photometric surveys, such as LSST\n\nBeyond these direct measurements, galaxy surveys offer a way to isolate the cosmological gravitational wave background (CGWB). I will briefly present recent results on the cross-correlation between the anisotropies of the CGWB and galaxies. I will highlight the role of this cross-correlation as a crucial tool to distinguish the CGWB from the astrophysical GWB."
  },
  "Carlos Bengaly": {
    "title": "Testing the isotropy of FRB sky distribution",
    "abstract": "Fast Radio Bursts (FRBs) are highly energetic transient events characterized by millisecond durations and radio-frequency emission (typically at GHz frequencies). Their large dispersion measures (DMs) strongly suggest an extragalactic, and often cosmological, origin. Since the number of detected events is increasing due to newly available surveys, FRBs constitute a promising observational probe for testing large-scale isotropy in the Universe – as it is part of the Cosmological Principle, one of the foundations of the standard cosmological model. In this walk, I will present a test of the statistical isotropy of the Universe using the sky distribution of the current FRB sample. Our analysis is based on the two-point angular correlation function (2pACF) of 4075 FRBs detected thus far. I will show that, after masking the galactic plane and taking into account a selection-function criteria specific to the different surveys, the FRB celestial distribution is compatible with the statistical isotropy hypothesis."
  },
  "Dorian Araya": {
    "title": "Observational background constraints on alternative cosmological models beyond ΛCDM",
    "abstract": "The standard ΛCDM model provides an excellent description of a wide range of cosmological observations, but it still faces important theoretical and observational challenges, including the cosmological constant problem, the coincidence problem, and the tensions associated with the Hubble constant. Motivated by these issues and by recent indications that the late-time dark sector may be more complex than a pure cosmological constant, this work studies cosmological scenarios beyond the standard model at the background level: a phenomenological emergent logistic dark energy model and a Unimodular Gravity model with a phenomenological redshift dependent contribution.\n\nThese models are constrained using current background cosmological observations, including Observational Hubble data, Type Ia Supernovae, Baryon Acoustic Oscillations, and Cosmic Microwave Background distance priors. We reconstruct the Hubble parameter H(z), the deceleration parameter q(z) and compare the statistical performance of the models using the Akaike and Bayesian information criteria."
  },
  "Felipe Asenjo": {
    "title": "Cosmología de laboratorio en Chile: Ondas de choque de plasma como análogos de cosmologías wCDM y de ondas gravitacionales cosmológicas",
    "abstract": "Presentaremos los resultados del primer experimento análogo de cosmología utilizando ondas de choque de plasma. En este experimento demostramos que la evolución de la onda de choque sigue la misma dinámica que la evolución de un Universo descrito por el modelo cosmológico estándar wCDM. Incluso podemos imitar la presencia de la energía oscura, la cual equivale a una fuente de aceleración de la onda de choque. Vemos también que la ley de Hubble está presente en la evolución experimental de la onda de choque. Asimismo, las perturbaciones del frente de la onda de choque presentan la misma evolución que las ondas gravitacionales cosmológicas. Analizaremos las implicaciones de estos resultados y discutiremos como este experimento clásico constituye un escenario análogo perfecto para estudiar cosmología en un laboratorio de bajo presupuesto."
  },
  "Hermano Endlich Schneider Velten": {
    "title": "Oscillating late-time ISW effect in trace-dependent modified gravity.",
    "abstract": "We present preliminary results on cosmological perturbative aspects of f(R,T) gravity, being T the trace of the energymomentum tensor, focusing on oscillating features that appear in matter clustering growth and in the late-time Integrated Sachs–Wolfe (ISW) effect"
  },
  "Simón Riquelme": {
    "title": "Superfluid phonons as a laboratory for inflationary EFT: quartic matching, forward data, and finite-density effects",
    "abstract": "Superfluid phonons at finite density and inflationary effective field theory are different physical settings, but they raise the same Goldstone-EFT questions about Wilson coefficients, field redefinitions, and the forward data left after integrating out heavy modes. This talk works through those questions in a quartic phonon theory at finite chemical potential, using the superfluid as a concrete laboratory rather than a stand-in for inflation. After canonical normalization we obtain the tree-level equal-energy center-of-mass two-to-two amplitude, extract the leading forward coefficients, and show that the local result is analytic in the center-of-mass energy and splits into contact, exchange, and dispersive parts. A tree-level comparison with a finite-density scalar theory obtained by integrating out a heavy radial mode gives agreement at leading and next-to-leading order for the sound speed, the leading dispersive coefficient, and the order-two forward datum, while the order-three datum leaves a small calculable residue that marks what finite density keeps beyond a purely inflationary reading. The same dispersive coefficient also governs the first departure from linear dispersion and the opening of Beliaev decay, within the usual distinction between a strict low-momentum regime, a finite-energy EFT window, and medium-specific ultraviolet effects."
  },
  "Júlio Fabris": {
    "title": "The generalized unimodular theory",
    "abstract": "The generalized unimodular theory is obtained by broken the usual invariance by time reparametrization of geometric theories of gravity. We show how the components of the dark sector may, in this structure, acquire a geometric origin. The cosmological background and perturbative properties of this theory are discussed."
  },
  "Enrico D. Schiappacasse": {
    "title": "Gravity \u0026 Light: A New Multi-Messenger Window into Dark Matter",
    "abstract": "What if we could detect dark matter via both gravity and light simultaneously? We investigate a hybrid scenario: the inspiral of a primordial black hole and a neutron star surrounded by a QCD-axion minihalo. Our results show that the combination of radio emissions and gravitational waves creates a distinct, detectable signal, opening an exciting new avenue for multi-messenger astronomy."
  },
  "Francisco Plaza": {
    "title": "Unimodular Gravity Cosmology: Constraints from DESI DR2 and Complementary Observations",
    "abstract": "Motivated by the recent baryon acoustic oscillation measurements from the DESI DR2 collaboration, in this talk we present an extended analysis of a cosmological model based on holographic dark energy within the framework of Unimodular Gravity (UG). In this setting, UG allows us to account for the accelerated expansion of the Universe through the modified gravitational dynamics themselves, while permitting spacetime variations in the effective cosmological constant. We confront the model with a wide range of observations, from Type Ia supernovae and baryon acoustic oscillations (DESI DR2) to quasars and Planck CMB data. We will discuss whether this framework alleviates the Hubble tension and how it compares to the standard $\\Lambda$CDM model in terms of Bayesian model selection."
  },
  "Francisco Colipi Marchant": {
    "title": "A Unified Numerical Study of Axion Stars: From the Nonrelativistic Regime to General Relativity",
    "abstract": ".In this presentation, we will explore the range of validity of the relativistic approximations used to compute axion-star mass–radius relations. To do this, we will numerically contrast their ground-state configurations using a common attractive quartic self-interaction across four theoretical frameworks: the Newtonian Schrödinger–Poisson description, first- and second-order relativistic Effective Field Theories (EFTs), and the full Einstein–Klein–Gordon system. We will demonstrate how relativistic EFTs systematically interpolate between the Newtonian limit and full General Relativity, and discuss how the substantial discrepancies at weak and moderate couplings, despite all models recovering the dilute-star scaling at large couplings, reveal the breakdown of the nonrelativistic structural description. Furthermore, we will evaluate the explicit impact of temporal-harmonic and cosine potential truncations on maximum mass calculations. Ultimately, this talk aims to provide a systematic benchmark to determine exactly when the Newtonian approximation suffices, and when relativistic corrections or full General Relativity are strictly required for modeling axion-star structure."
  },
  "Patrick Concha Aguilera": {
    "title": "Torsional Carroll Gravity",
    "abstract": "The ultrarelativistic (Carrollian) regime of gravity has recently emerged as a fertile framework for exploring holography, non-Lorentzian symmetries, and geometric limit of general relativity. In this Letter, we establish the presence of a nonvanishing torsion within three-dimensional Carrollian gravity by constructing the Carrollian Mielke-Baekler (C-MB) gravity theory in its Chern-Simons formulation, obtained as the ultrarelativistic limit of the relativistic Mielke-Baekler model. The resulting C-MB theory features nonzero temporal torsion and curvature, together with spatial curvature, providing the most general three-dimensional Carrollian gravity model with these properties. Temporal torsion affects nonaffinity of null generators and boundary dynamics. Several known ultrarelativistic gravity theories arise as particular limits of this framework, highlighting its unifying character."
  },
  "Susana Landau": {
    "title": "Applications of the PINN bundle method to the cosmological scenario",
    "abstract": "In recent years, the use of machine learning methods to analyze data and physical models has increased significantly. Among the various methods that have been developed, there is one that allows one to obtain a bundle of solutions of differential systems without relying on numerical methods.  The great advantage of this method is that, once the neural networks have been trained, the solution can be used indefinitely without the need to repeat the integration process, as is the case of traditional numerical solvers. As a result, the computational times of  inference processes are significantly reduced. In this talk I discuss our recent work applying the PINN bundle method to the cosmological scenario. As a first step, we addressed the problem of obtaining the background dynamics of the Universe across different cosmological models. Our implementation demonstrates substantial computational efficiency gains while maintaining solution accuracy. We have also successfully extended this methodology to the matter perturbation equation. Furthermore we computed for the first time a bound on the error of the obtained solution without depending on the numerical method for validation."
  },
  "Evelyn Rodríguez": {
    "title": "Maxwell Chern-Simons gravity in 3D: Thermodynamics of cosmological solutions and black holes with torsion",
    "abstract": "We construct generalized sets of asymptotic conditions for both three-dimensional Maxwell Chern-Simons gravity and a novel extension that incorporates torsion through a deformation of the Maxwell algebra. These boundary conditions include the most general temporal components of the gauge fields that consistently preserve the corresponding asymptotic Maxwell algebras with identical classical central charges, while allowing for the inclusion of chemical potentials conjugate to the conserved charges. We show that both sets of asymptotic configurations admit nontrivial solutions carrying not only mass and angular momentum but also an additional global spin-2 charge. In the torsionless case, the theory admits locally flat cosmological spacetimes, whereas in the presence of torsion, it generalizes to BTZ-like black hole geometries. For each case, the thermodynamic properties are consistently derived in terms of the gauge fields and the topology of the Euclidean manifold, shown to correspond to a solid torus."
  },
  "Jordan Zambrano": {
    "title": "Consistency test using Gaussian Processes for Non-pametric reconstruction",
    "abstract": "Null tests provide a framework for testing the assumptions underlying the standard cosmological model. Different null tests are designed to probe specific aspects of the fiducial ΛCDM model[1,2]. They are formulated to rely solely on consistency relations between observable quantities, providing a model-independent way to assess the validity of the cosmological model. In this work, we propose a new null test for the matter density parameter, Ωm, which, according to the standard cosmological model, should remain constant with redshift. Unlike consistency tests based solely on background observables, our approach combines measurements of the Hubble parameter, H(z), and the bias-independent growth-rate observable, fσ8(z), providing a complementary test that jointly probes the expansion history and the growth of cosmic structure.\n\nAs a reconstruction method, we employ Gaussian Processes [3,4], which enable the non-parametric reconstruction of functions, their derivatives, and associated uncertainties without assuming a specific cosmological model. We validate the proposed null test using mock observations with noise levels of up to 20%, representative of current observational uncertainties. We reconstruct H(z) and fσ8(z) and find that the proposed test successfully recovers the expected constant value of Ωm within the estimated uncertainties, showing no statistically significant deviations from the ΛCDM prediction. These results demonstrate that both the reconstruction procedure and the proposed null test are robust under realistic observational conditions, providing a reliable foundation for future applications to real cosmological data.\n\n[1] I. Ocampo et al., arXiv:2507.22780 [astro-ph.CO] (2025).\n[2] S. Nesseris et al., Astron. Astrophys. 660, A67 (2022).\n[3] M. Seikel, C. Clarkson, and M. Smith, J. Cosmol. Astropart. Phys. 06 (2012) 036.\n[4] L. Perenon et al., Phys. Dark Univ. 37 (2022) 101119"
  },
  "Pedro Alvarez": {
    "title": "Exploring the geometries of susy in the adjoint representation",
    "abstract": ""
  },
  "Pedro Mineiro Cordoeira": {
    "title": "Statistical comparison between the Timescape model and $\\Lambda$CDM through Cosmic Chronometers measurements",
    "abstract": "This study presents an observational test of the Timescape cosmological model, an inhomogeneous scenario in which cosmic acceleration emerges from backreaction and differential clock rates rather than dark energy, using Cosmic Chronometers (CC) and Type Ia Supernovae (SNe Ia) data. A fully Bayesian Markov Chain Monte Carlo analysis is performed, first constraining the model with 36 CC measurements of H(z)  spanning 0.01≤z≤1.965 , and subsequently with a joint dataset combining CC and the Pantheon+ SNe Ia compilation. For the CC-only case, the Timescape parameters remain compatible with previous studies, but exhibit a significant degeneracy between the Hubble constant, H0​ , and the present-day void volume fraction, fv0​ , that limits the constraining power at high confidence levels. Statistical model comparison shows no strong preference for either model: the Bayes factor marginally favors Timescape, whereas the information criteria tend to favor Λ CDM. In the joint CC+SNe Ia analysis, the added luminosity-distance information breaks the parameter degeneracy and yields substantially tighter constraints. The model comparison metrics, including AIC, BIC, DIC, WAIC and the Bayes factor, consistently favor the Timescape model, although only two of them exceed the threshold for non-negligible evidence. The results indicate that, while current CC data alone cannot distinguish between the two models decisively, the combination with SNe Ia renders the Timescape scenario a competitive, and statistically preferred, alternative to standard Λ CDM cosmology."
  },
  "Claudia Scóccola": {
    "title": "Generalized tension metrics for multiple cosmological datasets",
    "abstract": "Over the past two decades, cosmological observations have achieved unprecedented precision and volume. Although the $\\Lambda$CDM model successfully describes most observational datasets, persistent discrepancies remain, being the most significant one the $H_0$ tension: measurements of the present-day Hubble parameter derived from CMB observations within the $\\Lambda$CDM framework are incompatible with late-time determinations from Type Ia supernovae and Cepheids. Despite considerable effort, the source of this tension remains unresolved, highlighting the need for rigorous statistical tools to compare parameter estimates across independent datasets.\n\nIn this talk, I will describe a novel estimator to quantify statistical tensions among multiple cosmological datasets simultaneously. This estimator generalizes the Difference-in-Means statistic, $Q_{\\rm DM}$, to the multi-dataset regime. Our framework enables the detection of dominant tension directions in the shared parameter space. It further provides a geometric interpretation of the tension for the two- and three-dataset cases in two dimensions. According to this approach, the previously reported increase in tension between DESI and Planck from $1.9\\sigma$ (DR1) to $2.3\\sigma$(DR2) is reinterpreted as a more modest shift from $1.18\\sigma^{\\rm eff}$ (DR1) to $1.45\\sigma^{\\rm eff}$ (DR2)."
  },
  "Pamela Marchant Cortés": {
    "title": "Beyond the Zone of Avoidance: mapping the hidden structure and dynamics of the Local Universe",
    "abstract": "Understanding the dynamics of the Local Universe requires mapping the structures that shape its density and peculiar-velocity fields. However, important structures such as the Local Void, Great Attractor, and Vela supercluster intersect regions strongly obscured by the Milky Way. Our VVV/VVVX studies have identified more than 167,000 galaxies across the southern Galactic disc, while new VVVX Deepstack and JWST observations reveal faint and low-surface-brightness populations missed by previous searches. Together with multi-wavelength information and new KMOS spectroscopy, these results are extending our view of the hidden galaxy population from projected distributions towards distances, radial velocities, and physical properties.\n\nThese results open a direct route from galaxy searches in the Zone of Avoidance to Local Universe cosmography. Our aim is to provide the observational information needed to reconstruct the three-dimensional galaxy distribution across the Galactic plane, complement existing maps of the local cosmic web, and improve the sampling of the density and velocity fields used in cosmological studies. Of particular interest is the south supergalactic pole, approached by the VVV/VVVX footprint, where peculiar velocities can provide a nearly direct probe of the vertical, SGZ component of the local velocity field. This offers the prospect of testing whether motions below the supergalactic plane are consistent with the reflex of our motion away from the Local Void or require an additional contribution from still-hidden mass concentrations. By recovering this missing region, we aim to provide new observational constraints on the structures and gravitational drivers that shape the dynamics of the Local Universe."
  },
  "Matías Zúñiga Sepúlveda": {
    "title": "Noise modeling in ground CMB experiments",
    "abstract": "The search for primordial gravitational waves imprinted in B-mode polarization is a key goal in probing cosmic inflation, demanding extreme observational precision. Consequently, it is critical to rigorously account for all sources of systematic uncertainty, particularly correlated noise, and propagate them through the analysis pipeline. In this work, we investigate how to model noise contributions at the Time-Ordered Data (TOD) level in ground-based CMB experiments, such as the Simons Observatory (SO), and evaluate their impact on the mapmaking process"
  },
  "Hugo Prado": {
    "title": "Low X-ray luminosity galaxy clusters in the eROSITA era I. statistical identification and physical characterisation",
    "abstract": "Context. X-ray-selected cluster samples are expected to underrepresent systems with low X-ray luminosity and low surface brightness,\nespecially toward the low-mass regime.\nAims. We aim to characterise the low-luminosity side of the eRASS1 cluster population and, within it, to identify low-X-ray-\nluminosity clusters (LXLCs) through a redshift-aware and structurally motivated definition. We also assess the relevance of these\npopulations for the LX–M plane.\nMethods. Starting from 7 988 optically confirmed eRASS1 clusters, we modelled the log LX,500–z relation with quantile regression and\ndefined low- and high-luminosity regimes relative to the redshift-dependent luminosity distribution. We then built a compact descriptor\nspace from optical richness and X-ray morphology using mutual-information-based redundancy control, and compared the luminosity\nregimes over the stable redshift range z \u003c 0.7. From the resulting descriptor-space contrasts, we defined three complementary low-\nluminosity samples: LXLC, LXLC2, and cLXLC. We finally compared these populations with independent optical mass and richness\nestimates from the WH24 cluster catalogue and with the nearby X-ray-unbiased sample XUCS.\nResults. The low-luminosity regime is systematically associated with lower optical richness and with X-ray properties consistent with\na less regular and less centrally concentrated ICM than in the high-luminosity regime. Our selection yields 138 LXLC, 110 LXLC2,\nand 904 cLXLC systems. In the WH24 LX–M plane, the low-luminosity samples preferentially occupy the underluminous side of\nthe relation. In the redshift range directly comparable to XUCS, the observed scatter of the WH24-based LX–M relation is 0.477,\ncomparable to that reported for X-ray-unbiased nearby samples. Luminosity residuals of the relation correlate most strongly with\ncentral surface brightness and gas fraction, and more moderately with quantitative ICM-structure descriptors.\nConclusions. The low-luminosity side of the eRASS1 cluster population is composite rather than homogeneous. LXLC traces the\ncanonical low-richness, perturbed-ICM expression of a multivariate luminosity-linked signal, LXLC2 extends the same structural\nmode toward higher luminosities, and cLXLC probes its heterogeneous low-luminosity remainder. Despite these differences, all three\npopulations occupy the low-surface-brightness, gas-poor, and underluminous regime. Our results suggest that part of the diversity in\nthe LX–M plane is demographic in origin, reflecting the coexistence of structurally distinct cluster populations."
  },
  "Gerald Neumann": {
    "title": "Cosmological evolution of interacting dark energy with a Chevallier-Polarski-Linder equation of state",
    "abstract": "In this work, we examine interacting dark sector models within the Chevallier-Polarski-Linder (CPL) parametrization, focusing on two widely studied interaction terms linearly proportional to dark energy and dark matter densities:  Q = beta * H * rho_de and Q = beta * H * rho_c. These solutions involve incomplete gamma functions and reveal a rich, nontrivial mathematical structure governing the evolution of the dark sector that is often missed in numerical analyses. We perform a Bayesian analysis using a combination of current cosmological observations, including Hubble parameter measurements, Type Ia Supernovae, Baryon Acoustic Oscillations, and Cosmic Microwave Background data. Relative to the non-interacting CPL scenario, the interacting model with Q = beta * H * rho_de yields a modestly improved fit, whereas the model proportional to dark matter density is observationally disfavored. The preferred interacting scenario indicates that the dark energy equation of state evolves dynamically, transitioning from an effective phantom regime at high redshift to quintessence-like behavior at late times. Further analysis suggests the possibility of a future transition from accelerated to decelerated expansion, primarily associated with the reconstructed CPL dynamics, while the interaction alters the detailed evolution of the dark sector and the precise transition epoch. In this talk, I will discuss the theoretical formulation, the exact analytic background, and the cosmological implications of these findings for the evolution of the Universe."
  },
  "Jose Perdiguero": {
    "title": "Gravitational Wave Birefringence in generalized Palatini Chern Simons",
    "abstract": "We investigate cosmological gravitational-wave (GW) birefringence in a f(R) model coupled to a dynamical Chern-Simons term, using both metric and Palatini formalisms.\n\nWe find amplitude and velocity birefringence in the Palatini formalism, while the metric formalism predicts amplitude birefringence only, with effects depending on the form of f(R)."
  },
  "Antonella Cid": {
    "title": "Matter creation cosmologies and interacting dark energy: an explicit correspondence",
    "abstract": "The relation between gravitational matter creation and interacting dark energy has been explored case by case: particular creation rates are known to reproduce the behavior of dark energy models, and specific interacting models have been analyzed within this framework. Here we treat the correspondence in general, for a family of creation rates rather than isolated cases.\n\nStarting from a single-fluid cosmology with a creation rate proportional to a power of the Hubble expansion rate, we determine the conditions for late-time acceleration and confront the model with Pantheon+ supernovae, DESI-DR2 BAO and a CMB geometric prior. We then obtain a relation that maps any model of this class onto a two-fluid interacting dark sector, fixing the interaction term in terms of the creation rate, the equation-of-state parameter and the Hubble rate. The map runs in both directions: interaction functions already studied in the literature correspond to particular creation rates, and conversely each creation rate selects an interaction, several of which change sign during the evolution. Using dynamical systems techniques for a time-dependent equation of state, we characterize the critical points and identify which configurations lead to stable accelerated attractors.\n\nBased on: F. Arévalo, A. Cid, V. Cárdenas, P. Mella, Eur. Phys. J. C 86, 432 (2026)."
  },
  "Adil Imam": {
    "title": "Tests of scalar polarizations with multi-messenger events",
    "abstract": "Gravitational wave (GW) observations provide a unique opportunity to test Einstein’s General\nRelativity (GR) in the strong-field regime. While GR predicts only two tensor polarization modes, generic metric theories allow up to six independent modes. We perform a parameterized test of GR using the parameterized post-Einsteinian (PPE) framework applied to GW170817, incorporating for the first time the polarization angle constraints from the gamma-ray burst afterglow alongside other electromagnetic (EM) counterpart information. We extend the GR waveform by adding a scalar breathing mode and modifications to the tensor modes, introducing three non-GR parameters. We perform Bayesian inference for both quadrupole ℓ = |m| = 2 and dipole ℓ = |m| = 1 angular harmonics, with two frequency evolution models. For ℓ = |m| = 2 , we find mild preference for a scalar mode (scalar amplitude deviates from zero at ∼ 2σ), while for the ℓ = |m| = 1, we find no preference for a scalar mode. The EM constraint on the polarization angle places very tight bounds on non-GR parameters; for instance, in the case ℓ = |m| = 2, the bound on the scalar (tensor) amplitude modification parameter improves by roughly 60% (30%), highlighting the impact that long-term follow up of GW events can have on tests of gravity."
  },
  "Rodrigo von Marttens": {
    "title": "Standard Perturbation Theory for Interacting Dark Sector cosmologies",
    "abstract": "Interacting dark sector (IDS) models provide a commonly explored extension of the standard ΛCDM cosmology, allowing for non-gravitational energy--momentum exchange between cold dark matter (CDM) and dark energy (DE). Although such models can be constructed to reproduce the same background expansion history as ΛCDM, their impact on the growth of cosmic structures is fundamentally different and requires a careful treatment of cosmological perturbations. In this work, we develop the one-loop Standard Perturbation Theory (SPT) formalism for IDS cosmologies without invoking the Einstein--de~Sitter (EdS) approximation. We show that even weak dark sector interactions induce a non-trivial time dependence in the perturbative kernels, leading to a breakdown of the EdS approximation commonly assumed in ΛCDM analyses. By deriving and numerically solving the evolution equations for the second- and third-order kernels, we compute the corresponding one-loop corrections to the matter power spectrum and find that the resulting deviations can significantly exceed the percent level, even for small interaction strengths. Our results demonstrate that nonlinear corrections are systematically enhanced in IDS models and that neglecting the full time dependence of the kernels can lead to biased predictions on mildly nonlinear scales. These findings establish the necessity of a time-dependent perturbative treatment for IDS scenarios and provide a robust framework for precision tests using nonlinear large-scale structure (LSS) observables."
  },
  "Felipe Orellana": {
    "title": "Particle acceleration in a black hole magnetosphere",
    "abstract": "Since they have been paid attention in astrophysics, black holes (BHs) have come out as key to explain many high energy astrophysical phenomena such as relativistic plasma jets, X-ray accretion emissions and non-thermal flares. The way BHs power all of these processes is not yet fully understood, but there is consensus in the relevance of its spin, since spinning BHs feature a region called the ergosphere where BHs rotational energy can be extracted. \nTaking advantage of this feature, there is the Blandford-Znajek process, which successfully explains plasma jet ejection, mediated by large scale magnetic fields twisted by frame dragging in the ergosphere. A more recent theoretical proposal is the Comisso-Asenjo process, in which plasmoid-mediated extraction of energy from a highly spinning BH is possible through magnetic reconnection in the ergosphere, feeding particle acceleration which could be responsible for non-thermal flares observed in Sag A* or M 87*. In this work we perform global particle-in-cell simulations of a Kerr BH magnetosphere in order to test and extent this process to a wider range of BH spin parameters."
  },  
  "Saulo Carneiro": {
    "title": "",
    "abstract": ""
  },
  "Jonathan Claros": {
    "title": "Analytical Pulsar Magnetospheres in Parametrized Spacetimes: Imprints of Strong-Field Geometry on Light Curves",
    "abstract": "We study analytical force-free models of pulsar magnetospheres in parametrized spacetime geometries, with particular emphasis on the structure of the polar caps and their imprint on observed light curves. The magnetospheric configurations provide a tractable description of the open-field-line region and the associated polar-cap geometry. The underlying spacetime is described by a broad parametrized family that includes several known compact-object geometries as particular cases. We analyze how variations in the spacetime geometry affect both the force-free magnetospheric structure and photon propagation to a distant observer. In particular, we quantify their impact on the polar caps and emission regions, as well as the effects of gravitational light bending, redshift, aberration, and time delays on the resulting pulse profiles. By employing new analytical ray-tracing formulas derived by us, the corresponding light curves can be computed within a few seconds, providing an efficient framework for studying signatures of strong-field spacetime geometry in pulsar observations. This work has been made in collaboration wih Emanuel Gallo."
  },
  "Eduardo Guendelman": {
    "title": "Constructing de Sitter space and Dark Matter with Dynamical Tension Strings",
    "abstract": "The string tensions can be dynamical in the modified measure formalism and appear as an additional dynamical degrees of freedom . These tensions may not be universal, instead, each string generates its own tension. We then consider a new bulk field that can couple to the strings, the tension scalar which changes locally the tension along the world sheet. In the case with two string tensions there is a braneworld solution which gives rise to an induced de Sitter space in the brane, avoiding swampland constraints of the standard string theory. Strings with different tension to ours can appear also as Dark Matter and since they share the same space and compactifications as visible matter, they should lead to Dark copies of the standard model,"
  },
  "Emanuel Gallo": {
    "title": "From hypersurfaces to spacetime: covariant Hamilton-Jacobi and null surface geometry in n dimensions",
    "abstract": "We develop new covariant formulations of the Hamilton-Jacobi and Null Surface approaches to spacetime geometry in n dimensions. In both cases, the fundamental variable is a globally defined scalar function Z whose level sets determine families of hypersurfaces, while the spacetime metric is reconstructed as a derived geometrical object. The resulting description is associated with systems of nonlinear partial differential equations (PDEs) and with geometric structures on the corresponding fiber bundles. We show that the generalized Wünschmann conditions define a torsion-free geometry for these PDE systems, extending to n dimensions known results in 3 and 4 dimensions, and discuss the associated conformal Cartan connection. We also introduce new perturbative ansätze for constructing approximate analytical solutions of the resulting PDEs and recovering the corresponding spacetime geometries."
  },
  "Pedro Labraña": {
    "title": "Connecting Early and Late Dark Energy through the Diluting Matter Potential",
    "abstract": "In this work we study a scale invariant gravity theory containing two scalar fields, dust particles and a measure defined from degrees of freedom independent of the metric. The integration of the degrees of freedom that define the measure spontaneously break the scale symmetry, leaving us in the Einstein frame with an effective potential that is dependent on the density of the particles. The potential contains three flat regions, one for inflation, another for early dark energy and the third for late dark energy. At a certain point, as the matter dilutes, tunneling from the early dark energy to the late dark energy can start efficiently. This mechanism naturally alleviated the observed Hubble tension by modifying the sound horizon prior to recombination while preserving late-time cosmology. \nWe perform a Bayesian analysis to confront the proposed model with observational constraints from the reduced CMB, BAO, and local measurements of $H_0$. These results support the viability of the proposed scenario and motivate further studies using the full CMB likelihood."
  },
  "Marcelo Alejandro Rozas Rojas": {
    "title": "",
    "abstract": ""
  },
  "Diego M. Navia Rojas": {
    "title": "Ultra Slow Roll in Higgs Inflation and the CMB Low-ℓ Anomaly",
    "abstract": "The asymptotically flat plateau of tree-level Higgs inflation can sustain a transient ultra-slow-roll (USR) phase for specific pre-inflationary initial conditions. We systematically scan the phase space of initial field kinematics and identify trajectories where this non-attractor phase occurs near the horizon crossing of the largest observable CMB modes. Because USR violates the slow-roll attractor, we compute the primordial power spectrum by exact numerical integration of the Mukhanov–Sasaki equations, going beyond the slow-roll approximation. We find a localized suppression of the scalar power spectrum at k ≈ 5 × 10⁻⁴ Mpc⁻¹, which reduces the CMB quadrupole by up to 24% relative to the ΛCDM prediction while preserving the acoustic peak structure. The resulting temperature spectrum improves the low-ℓ Planck fit while remaining statistically indistinguishable from ΛCDM across the full spectrum (Δχ² = +40.7 over 2507 degrees of freedom). We also show that standard slow-roll estimates of the spectral index become unreliable near the onset of the USR transient, with deviations up to Δnₛ ≈ 0.03. These results reveal that even the minimal Higgs inflation setup can depart from attractor evolution and produce observable imprints at the largest cosmological scales."
  },
  "Marcos Ramirez": {
    "title": "Gibbons-Hawking-York boundary action and junction conditions for 4D Gauss-Bonnet gravity",
    "abstract": "We briefly review recent results in 4D Gauss-Bonnet gravity, a scalar-tensor theory that exhibits some of the defining features of EGB gravity (5 and 6-dimensional Lovelock gravity) for 4-dimensional spacetimes. We derive the natural boundary terms and the Gibbons-Hawking-York boundary action for this theory. Finally, we use these terms to derive the junction conditions and analyse their main properties."
  },
  "Carlos González": {
    "title": "A more general background  from Bessel´s solution  within G inflation",
    "abstract": "We study  general background associated to the well known Bessel´s solution for Mukhanov -Sasaki equation within G inflation.  Considering the trajectories in the r–ns\nplane from the Planck data, we find the constraints on the\nparameter space in our model."
  },
  "Mariana Lopes da Silva Dias": {
    "title": "Measurements of the Angular Homogeneity Scale from DESI DR1",
    "abstract": "The study of the large-scale distribution of galaxies provides essential information for testing the standard cosmological model, namely the $\\Lambda$CDM paradigm. This scenario is based upon two foundations: General Relativity as the theory of gravity, and  the Cosmological Principle, which states that the Universe is statistically homogeneous and isotropic on large scales – so that we can measure distances and ages in the Universe assuming the FLRW metric. \n\nIn this work, we perform a test of the Cosmological Principle by probing the angular homogeneity scale, $\\theta_H$, using the state-of-the-art observational data of Luminous Red Galaxies (LRGs) from the Dark Energy Spectroscopic Instrument Data Release 1 (DESI DR1). Our analysis is performed exclusively in two dimensions, across narrow redshift bins ($0.4 \u003c z \u003c 1.1$) in two different surveyed regions of the sky (North and South Galactic Caps), as we want to minimize a priori dependences on an underlying cosmological model. \n\nWe obtain that such a scale is indeed identified in all redshift ranges, and that they are consistent with mock simulations assuming the $\\Lambda$CDM model. Moreover, our results are in great agreement with previous measurements using Sloan Digital Sky Survey IV extended Baryon Oscillation Spectroscopic Survey Data Release 16 (SDSS-IV eBOSS DR16), as well as between the north and south galactic caps of the DESI DR1 survey. These findings help underpinning statistical isotropy and homogeneity of the Universe as a physically valid hypothesis in light of upcoming stage-IV redshift surveys, hence confirming one of the fundamental pillars of the standard cosmological model."
  },
  "Andres Burton Villalobos": {
    "title": "Stochastic inflation and long-wavelength inflaton dynamics in modified gravity",
    "abstract": "We explore the formalism of stochastic inflation within the framework of modified gravity theories to investigate the impact of small-scale quantum fluctuations on long-wavelength inflaton dynamics. While stochastic inflation is well-studied in General Relativity, its extension to alternative gravitational frameworks remains largely unexplored. In this work, we derive the modified Langevin and Fokker-Planck equations governing the coarse-grained inflaton field, explicitly accounting for the non-trivial corrections introduced by modified gravity actions.\n\nWe analyze how these modifications alter the stochastic noise of primordial perturbations, providing a new theoretical foundation to constrain alternative gravity theories through early universe cosmology."
  },
  "Erick Sebastián Contreras Pastén": {
    "title": "Supernova IA Luminosity-Distance Multipoles as Probes of Supercluster Kinematics",
    "abstract": "We develop a kinematic framework that relates the monopole, dipole, and quadrupole of the luminosity distance to an ellipsoidal peculiar velocity field describing the dynamics of the Laniakea supercluster. By properly accounting for the transformations between the CMB and Laniakea reference frames and selecting Type Ia supernovae within the volume associated with the superstructure, we show that luminosity distance multipoles encode the expansion and shear of the local velocity field. This allows the ellipsoidal kinematics of Laniakea to be inferred directly from supernova observations. Our results provide a physically motivated interpretation of luminosity distance anisotropies within the volume dynamically dominated by Laniakea as signatures of its large-scale kinematics. The framework developed here suggests that future supernova observations can enable the independent reconstruction of large-scale structures in the local Universe."
  },
  "Yifei Zhao": {
    "title": "Interacting Dark Enegy and Sign Change Vaccum",
    "abstract": "Recent cosmological results, such as early and late time estimates of the local expansion rate $H_0$ and baryon acoustic oscillations (BAO) measurements from the DESI collaboration, suggest that the standard $\\Lambda$-Cold Dark Matter ($\\Lambda$CDM) model may be incomplete. At the same time, theoretical developments based on swampland conjectures indicate that the realization of a stable de Sitter vacuum within string theory is challenging. Motivated by these observational and theoretical considerations, we investigate an interacting $\\Lambda$ scenario characterized by a general linear coupling in the dark sector. At the background level, this model naturally allows the dark-energy density to evolve from negative to positive values, opening the possibility of a transition from an anti-de Sitter-like phase to the de Sitter-like phase inferred by current observations. We derive the analytic background solutions, discuss the physically acceptable region of parameter space, and constrain the model with Pantheon+ type Ia supernovae and DESI BAO data. Our analysis shows that the resulting parameter space allows for a sign change in the effective dark-energy density while preserving the positivity of the dark matter energy density. Although the present analysis is restricted to the homogeneous background, it indicates that an anti-de Sitter to de Sitter transition driven by dark-sector interaction deserves further investigation."
  },
  "Jonathan Morais": {
    "title": "Cosmographic Parameters from Current and Next-Generation Gravitational-Wave Detectors: A Taylor-Expansion Approach",
    "abstract": "We evaluate the capability of current and next-generation gravitational wave detectors, such as Advanced LIGO, Einstein Telescope and DECIGO, to constrain cosmographic parameters using electromagnetically bright standard sirens. By adopting a third-order Taylor expansion, we analyze how signal-to-noise ratios and the number of events impact the estimates of the Hubble constant ($H_0$), the deceleration ($q_0$) and jerk ($j_0$) parameters. Our results show that while Advanced LIGO provides a calibration-free measurement of $H_0$ at the few-percent level, it remains insensitive to higher-order parameters. In contrast, the Einstein Telescope and DECIGO reach sub-percent accuracy for $H_0$. Notably, DECIGO achieves a precision better than 10\\% for the deceleration parameter $q_0$ and a few tens of percent for the jerk parameter $j_0$."
  },
  "Fabiola Arevalo": {
    "title": "On the Gaussian Assumption in the Estimation of Parameters for interacting Dark Energy Models",
    "abstract": "Type Ia supernovae have provided fundamental observational data in the discovery of the late acceleration of the expansion of the Universe in cosmology. However, these analyses have relied on the assumption of a Gaussian distribution for the data. In this work, we assess this Gaussianity hypothesis and analyze its impact on parameter estimation for interacting dark energy cosmological models. We utilize the Pantheon+ dataset and perform a statistical to assess the normality of both the data and model residuals.\nThe cosmological framework is two dark fluids with a phenomenological interaction Q to model the conversion of energy between dark energy and dark matter. By studying the Ansatz Q=Q(q), where q is the deceleration parameter, we can obtain an analytical solution, and, using three optimization methods, to obtain the best fit, Grid, EM and Gradient with three free parameters.\nWe find that the Gaussianity assumption is untenable and that the redshift distribution is more accurately described by a t-distribution, as indicated by the Kolmogorov Smirnov test. Without Gaussian assumptions, the model parameters are estimated and confidence intervals are constructed. For all priors and methods, using Supernovae data set, the best-fit model of reproduces the late-time acceleration of the Universe, exhibiting a transition from decelerated to accelerated expansion and a matter content compatible with available observations of the Universe.\n\nbased on F. Arevalo, L. Firinguetti and M. Pena, Phys. Dark Univ. 50 (2025), 102155 and F. Arevalo, A. Cid, L. P. Chimento and P. Mella, Eur. Phys. J. C 79 (2019) no.4, 355 ."
  },
  "Viviane Alfradique": {
    "title": "A statistical dark siren measurement of the Hubble constant with GWTC-4.0 and the DESI Legacy survey",
    "abstract": "The tension between early- and late-Universe measurements of the Hubble constant ($H_0$) remains one of the major challenges in modern cosmology. Gravitational-wave (GW) observations provide an independent probe of cosmic expansion through direct measurements of luminosity distances. In the absence of electromagnetic counterparts, the dark siren method statistically associates GW events with galaxies within their localization volumes to infer redshifts.\nWe present an updated measurement of $H_0$ using 17 well-localized binary black hole mergers detected by the LIGO–Virgo–KAGRA (LVK) network, including seven events from the first part of the fourth observing run (O4a). Our analysis combines GW localizations from the fourth Gravitational-Wave Transient Catalog (GWTC-4.0) with galaxy catalogs from the DESI Legacy Imaging Survey. Photometric redshift distributions are modeled using a deep-learning approach.\nRelative to previous analyses, we implement several refinements, including luminosity weighting based on $r$-band magnitudes, an extended likelihood incorporating binary mass information, and an improved treatment of selection effects associated with galaxy catalog incompleteness. Using only the dark siren sample, we obtain $H_0 = 78.8^{+14.6}_{-12.2}$ km/s/Mpc without luminosity weighting and $H_0 = 78.2^{+12.0}_{-11.0}$ km/s/Mpc when luminosity weighting is included.\nCombining the dark siren sample with the bright siren event GW170817, including constraints on the jet viewing angle and corrections for peculiar velocity, yields $H_0 = 69.9^{+4.1}_{-4.0}$ km/s/Mpc, corresponding to an $\\sim11%$ improvement in precision relative to GW170817 alone. These results highlight the growing potential of dark sirens as a competitive and independent probe of the expansion history of the Universe."
  },
  "Sebastian Cespedes": {
    "title": "Stochastic inflation from a non-equilibrium renormalization group",
    "abstract": "Understanding stochastic inflation, and in particular how to compute controlled corrections, remains an important open problem. In this talk, we study this problem using an effective field theory description of light fields in de Sitter space. Starting from a coarse-grained description, we derive an effective theory for the infrared dynamics of long-wavelength modes. As the coarse-graining scale is pushed below the Hubble scale, the dynamics becomes dominated by stochastic fluctuations and diffusion, reproducing stochastic inflation at leading order while allowing systematic corrections to be computed. We then analyse the renormalisation-group flow of the reduced density matrix under changes of the coarse-graining scale. In the infrared limit, the flow approaches a local stochastic regime described by a generalised Fokker–Planck equation. These results provide a unified framework for understanding stochastic inflation as the infrared limit of an effective field theory in de Sitter space."
  },
  "Raúl Rojas": {
    "title": "Black hole thermodynamics from scalar fields: Effective cosmological constant and pressure",
    "abstract": "We present exact black hole solutions coupled to a scalar field with a non-trivial potential, in which the scalar field approaches a constant value at infinity. This asymptotic value induces an effective cosmological constant, allowing these solutions to be reinterpreted as spacetimes with emergent asymptotic curvature. Within this framework, we propose an interpretation in which the asymptotic value of the scalar acts as an effective environmental parameter of the black hole, inducing a pressure analogous to that considered in the standard extended black hole thermodynamics. This approach enables the exploration of a scalar-driven extension of black hole chemistry, including the analysis of the first law, stability, and possible phase transitions."
  },
  "Gabriel Leon": {
    "title": "Emergence of Cosmic Structure from Planckian Discreteness",
    "abstract": "In the standard inflationary paradigm, the primordial seeds of cosmic structure arise from vacuum fluctuations of a homogeneous quantum state. In this talk, we discuss an alternative proposal in which the primordial inhomogeneities are generated from the outset by the discrete microscopic structure expected at the Planck scale. The basic idea is that, when the effective field-theoretic description becomes valid, scalar modes emerge already excited away from the vacuum due to their interaction with the underlying granularity. Within this framework, we show how one can reproduce the standard prediction for the primordial power spectrum. We also comment briefly on the expected implications for tensor modes."
  },
  "Carlos Eduardo Romero Figueroa": {
    "title": "Shadows and Thermodynamics of Magnetically Charged  Black Holes with Dark Matter and  Quintessence",
    "abstract": "We investigate the optical and thermal properties of non-linear magnetically charged Anti–de Sitter (AdS) black holes in the presence of perfect fluid dark matter and quintessence. The photon sphere and shadow are obtained from null geodesics, showing their sensitivity to the magnetic charge and dark matter parameter. In the extended phase space, we analyze the equation of state and phase structure.\n\nWe show that the model parameters suppress the standard van der Waals–like behavior, while quintessence can destroy criticality and enhance first-order phase transitions. These effects are further characterized using geometric thermodynamic methods, revealing consistent signatures that may be probed through black hole shadow observations."
  },
  "Rafael Bravo": {
    "title": "Positivity Bounds on Inflation",
    "abstract": "The effective field theory (EFT) of inflation provides a systematic framework to describe the primordial fluctuations that seeded cosmic structure. It captures the dynamics of the light Goldstone mode on a quasi–de Sitter background while parametrizing the physics of heavy degrees of freedom through higher-dimensional operators.\nOver the last decade, multiple efforts to understand the self-consistency of quantum gravity at high energy scales, where empirical constraints are limited, have translated into a set of theoretical restrictions on low-energy IR effective theories that admit a consistent UV completion.  A powerful, model-independent way to formulate such restrictions arises from positivity bounds, which follow from the fundamental principles of unitarity, locality, and causality in Lorentz-invariant QFTs. These principles lead to dispersion relations for scattering amplitudes in a Minkowski spacetime, imposing positivity conditions on combinations of Wilson coefficients that any consistent UV completion must satisfy.\nApplying these ideas to the EFT of inflation poses several conceptual challenges: cosmological observables are correlation functions rather than scattering amplitudes, the background is a dynamical quasi–de Sitter spacetime, and Lorentz invariance is spontaneously broken.\nIn this talk, I will present recent progress in extending positivity bounds to cosmological settings by exploiting the equivalence principle together with the rich (non-) analytic structure of a relativistic superfluid."
  },
  "Joaquín Robledo": {
    "title": "Nonlinear Scalarization of Reissner-Nordström Black Holes in Scalar-Maxwell-Teleparallel Gravity",
    "abstract": "In this work, we investigate the scalarization of the Reissner-Nordström black hole within a scalar-tensor teleparallel gravity framework. This approach enables a direct comparison between scalarization mechanisms induced by a scalar field nonminimally coupled to the torsion scalar and those resulting from its coupling to the electromagnetic invariant. We demonstrate the existence of distinct scalarized branches of solutions, classified by the number of nodes of the scalar field. These scalarized black hole solutions are asymptotically flat, and we analyze their thermodynamic properties."
  },
  "Gabriel Gómez": {
    "title": "Isotropic Universes with Anisotropic Vector Fields",
    "abstract": "We discuss how anisotropic vector fields can be consistently accommodated in a homogeneous and isotropic universe. We consider an SU(2) vector field containing both a spatial cosmic-triad configuration and a triplet of temporal components. We show that the non-Abelian structure of the field strength provides a minimal mechanism for preserving isotropy in the presence of these components. The isotropy conditions constrain the self-interacting potential, while the temporal vector equations ensure that the momentum density vanishes on shell. We discuss the implications of this construction and the possibility of probing its vector-field nature through gravitational-wave phenomenology."
  },
  "Rayff de Souza": {
    "title": "Coupled quintessence from an axion dark sector",
    "abstract": "Recent observational data arising from the DESI collaboration has hinted at a possible departure from the standard LCDM cosmological model, preferring instead the presence of a dynamical dark energy component. Specifically, the associated equation of state of the dark energy features a crossing into the so-called phantom regime, which is challenging to accommodate in canonical single scalar-field scenarios. However, this behavior can be effectively described by an interacting dark sector, where the specific dark energy equation of state remains above the phantom divide whilst the dark matter component deviates from the standard cold dark matter evolution. In this work, we explore this possibility in the context of an axion dark sector, where both the dark energy and dark matter are represented by two interacting axion-like fields. We show that given the required mass hierarchy for these fields to play such roles, their dynamics can be effectively placed in the coupled quintessence framework, where their motion follows from a sourced continuity equation in the fluid description. In this regime, we perform a statistical analysis of this scenario with current data, finding that a sub-Planckian dark energy axion decay constant stays well within the observational bounds without the need to fine-tune the associated field's initial conditions. We also perform a comparison with $\\Lambda$CDM, where we find that the model provides a better fit to the data while staying competitive from a Bayesian perspective."
  },
  "Temis Sebastián Muñoz Montecino": {
    "title": "Anisotropía cósmica y campos escalares acoplados conformemente en el universo de Kasner en dimensiones arbitrarias.",
    "abstract": "La teoría de la Relatividad General establece una profunda conexión entre las propiedades geométricas del espacio-tiempo y su contenido de materia. En este marco, el presente trabajo investiga la dinámica geométrica del universo de Kasner en dimensiones arbitrarias, en presencia de un campo escalar acoplado conformemente a la gravedad.\nTradicionalmente, la inclusión de un término de acoplamiento no minimal genera ecuaciones de campo con derivadas de cuarto orden respecto a la métrica, introduciendo inestabilidades patológicas conocidas como fantasmas de Ostrogradsky. Para evadir esta barrera teórica, la investigación implementa el formalismo matemático propuesto por Julio Oliva y Sourya Ray en el paper \"Conformal couplings of a scalar field to higher curvature terms\", basado en la construcción de un tensor covariante de rango cuatro. Esta estructura transforma covariantemente bajo reescalamientos locales de Weyl y hereda las mismas simetrías algebraicas del tensor de Riemann, garantizando un sistema de ecuaciones de movimiento estrictamente de segundo orden. Mediante la formulación de un ansatz métrico diagonal generalizado y una técnica de reducción analítica que vincula el perfil del campo escalar con la función métrica fundamental (Revisiting the static spherically symmetric solutions of gravity with a conformally coupled scalar field, Sourya Ray (2025)), se logra desacoplar el sistema diferencial. La integración exacta del modelo revela una familia de soluciones parametrizada por tres grados de libertad físicos independientes: la masa generalizada del espacio-tiempo, la amplitud de la carga escalar  y los parámetros de deformación anisótropa dictados por los exponentes de Kasner. \n\nA través de estos resultados, el estudio caracteriza cuantitativa y cualitativamente el impacto de la materia sobre la anisotropía del espacio-tiempo, lo que permite evaluar si el alineamiento isotrópico del universo primitivo fue una consecuencia directa de la estructura matemática de la gravedad en presencia de campos escalares con acoplamiento conforme, en lugar de un evento aleatorio. De este modo, la investigación aporta al entendimiento fundamental de los mecanismos que dictaron la tasa de isotropización en las etapas más tempranas del cosmos."
  },
  "Gabriel Rodrigues": {
    "title": "",
    "abstract": ""

  "Agripino Sousa Neto": {

    "abstract": ""
