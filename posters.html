itle": "Title to be announced"}, {"name": "Jorge Barja", "affiliation": "Universidad de Chile", "title": "Towards Realistic CMB B-mode Delensing with Quadratic Lensing Reconstruction"}, {"name": "Juan Rodríguez", "affiliation": "PUCV", "title": "Thermodynamic Criticality in FLRW Cosmology with Non-extensive Loop Quantum Gravity Entropy"}, {"name": "Katya Mir", "affiliation": "Universidad Técnica Federico Santa María", "title": "The impact of anisotropic models on supercluster kinematics"}, {"name": "Laura de Carvalho", "affiliation": "Universidade Federal da Bahia", "title": "From Topological Spines to 3D Profiles: Characterizing Cosmic Web Filaments in IllustrisTNG and MillenniumTNG"}, {"name": "Lilianne Tapia Pérez", "affiliation": "Pontificia Universidad Católica de Valparaíso/Universidad Técnica Federico Santa María", "title": "Title to be announced"}, {"name": "Lucas Bravo Gaete", "affiliation": "Pontificia Universidad Católica de Chile", "title": "Reconstructing Geometries from the AdS3 spectrum in Palatini Gauss Bonnet Gravity"}, {"name": "Luiz Fernando de Lima Pereira Pinto", "affiliation": "Universidade Federal Fluminense (UFF)", "title": "Probing the Early Universe Physics with the Stochastic Background of Gravitational Waves"}, {"name": "Mario Calderón Zenteno", "affiliation": "Universidad de Chile", "title": "Emulating the Non-Linear Matter Power Spectrum in Horndeski Modified Gravity"}, {"name": "Mauro Jélvez", "affiliation": "Universidad de Valparaíso", "title": "Photon paths in a magnetically charged black hole immersed in a quintessence field"}, {"name": "Mohsen Fathi", "affiliation": "Universidad Central de Chile", "title": "Dark Matter Imprints on Binary Caustics"}, {"name": "Mona Kariminezhaddahka", "affiliation": "Universidad Central de Chile", "title": "EC 21470-5412: Orbital Variability, Roche Geometry, and an Amplitude Puzzle"}, {"name": "Neill Guzmán", "affiliation": "Universidad Técnica Federico Santa María", "title": "Precision Cosmology with the Reconstructed Bispectrum"}, {"name": "Paulo Medero", "affiliation": "UBB", "title": "Creación de un Universo desde un Estado Estático de Einstein en Cosmología Cuántica"}, {"name": "Pía Barría", "affiliation": "Universidad de Valparaíso", "title": "Data analysis for cosmological interacting Chaplygin-Jacobi gas"}, {"name": "Rodrigo Pérez San Martín", "affiliation": "Universidad de Santiago de Chile", "title": "A Photon-Sphere Logarithmic Potential for Pseudo-Newtonian Accretion in Reissner–Nordström Spacetimes"}, {"name": "salomón romero", "affiliation": "PUCV/USM", "title": "Creation from Nothing"}, {"name": "Sofía González Cataldo", "affiliation": "Pontificia Universidad Católica de Valparaíso", "title": "Title to be announced"}, {"name": "Vicente Izzo", "affiliation": "Universidad Técnica Federico Santa María", "title": "Full-shape post-reconstruction clustering: a hybrid bias model beyond BAO fitting"}, {"name": "Vicente Silva", "affiliation": "Universidad de Santiago de Chile", "title": "Testing the Robustness of Dynamical Dark Energy Models with New DESI Data"}, {"name": "Yanina López", "affiliation": "Pontificia Universidad Católica de Valparaíso", "title": "Relativistic Simulations of Domain Wall Collapse and Their Role in Primordial Black Hole Production"}]}];
let selected=0;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let mathQueue=Promise.resolve();
function typesetMath(){if(window.MathJax?.typesetPromise)mathQueue=mathQueue.then(()=>window.MathJax.typesetPromise([document.getElementById('gallery')])).catch(()=>{});}
function render(){
 const session=sessions[selected];
 document.getElementById('session-title').textContent=session.label+' session';
 document.getElementById('session-description').textContent=session.time+' · During the coffee break';
 document.querySelectorAll('[data-session]').forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));
 const query=normalize(document.getElementById('search').value.trim());
 const visible=session.posters.filter(p=>normalize(p.title+' '+p.name).includes(query));
 document.getElementById('result-count').textContent=query?visible.length+' of '+session.posters.length+' posters':session.posters.length+' posters';
 const gallery=document.getElementById('gallery');
 if(window.MathJax?.typesetClear)window.MathJax.typesetClear([gallery]);
 gallery.className='gallery'+(selected===1?' afternoon':'');
 gallery.innerHTML=visible.map(p=>`<article class="poster"><h3${p.title==='Title to be announced'?' class="pending"':''}>${escapeHTML(p.title)}</h3><div class="presenter">${escapeHTML(p.name)}</div><div class="affiliation">${escapeHTML(p.affiliation)}</div></article>`).join('')||'<p class="no-results">No matching posters in this session.</p>';
 typesetMath();
}

document.getElementById('print').addEventListener('click',()=>window.print());
render();
